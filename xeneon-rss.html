


<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>XENEON EDGE RSS Wall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;          /* 全面黒背景 */
      color: #fff;
      overflow: hidden;
    }
    #frame-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="frame-wrapper">
    <iframe
      id="rssWall"
      src="https://rss.app/embed/v1/wall/1Ls2C1t5ZsaWeT4q">
    </iframe>
  </div>

  <script>
    // ===== 設定：リロード間隔（ミリ秒） =====
    // Basicプランなら60分程度、Proなら15〜20分程度がおすすめ
    const REFRESH_INTERVAL_MS = 60 * 60 * 1000; // 60分ごと

    const iframe = document.getElementById('rssWall');
    const baseUrl = "https://rss.app/embed/v1/wall/1Ls2C1t5ZsaWeT4q";

    function refreshIframe() {
      // キャッシュを避けるため、クエリに時間を付ける
      iframe.src = baseUrl + "?t=" + Date.now();
    }

    // 一定間隔で自動リロード
    setInterval(refreshIframe, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
